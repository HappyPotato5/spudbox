[package]
name = "spudbox"
version = "2.0.1"
edition = "2024"
description = "A library that implements lots of useful data types."
authors = ["HappyPotato5"]
repository = "https://github.com/HappyPotato5/spudbox"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
hashbrown = { version = "0.17.1", optional = true}

[features]
default = ["arena", "ordered-set", "vecset"]
no-prelude = []
arena = []
ordered-set = ["dep:hashbrown"]
vecset = []
lexer = []
parse = []
